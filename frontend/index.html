<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATHENA - Smart Contract Security Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-row">
            <div>
                <div class="logo">ATHENA</div>
                <div class="subtitle">Smart Contract Security Analysis</div>
            </div>
            <div id="wallet-section">
                <button id="connect-btn" onclick="connectWallet()">Connect Wallet</button>
                <span id="wallet-address"></span>
            </div>
        </div>
    </header>

    <main>
        <!-- Summary -->
        <section id="summary-section" class="section">
            <div class="section-header">AUDIT SUMMARY</div>
            <div id="summary-content" class="loading">Loading...</div>
        </section>

        <!-- Target -->
        <section id="target-section" class="section">
            <div class="section-header">TARGET</div>
            <div id="target-content" class="loading">Loading...</div>
        </section>

        <!-- Findings -->
        <section id="findings-section" class="section">
            <div class="section-header">FINDINGS</div>
            <div id="findings-list" class="loading">Loading...</div>
        </section>

        <!-- Verification -->
        <section id="verification-section" class="section">
            <div class="section-header">VERIFICATION</div>
            <div id="verification-content" class="loading">Loading...</div>
        </section>

        <!-- Attack Simulation -->
        <section id="attack-section" class="section">
            <div class="section-header">ATTACK SIMULATION</div>
            <div id="attack-content" class="loading">Loading...</div>
        </section>

        <!-- Attestation -->
        <section id="attestation-section" class="section">
            <div class="section-header">ON-CHAIN ATTESTATION</div>
            <div id="attestation-content" class="loading">Loading...</div>
        </section>

        <!-- Certificate / NFT -->
        <section id="certificate-section" class="section">
            <div class="section-header">AUDIT CERTIFICATE</div>
            <div id="certificate-content" class="loading">Loading...</div>
        </section>
    </main>

    <footer>
        <div class="footer-text">Powered by GLM-5.1 | Athena</div>
    </footer>

    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
