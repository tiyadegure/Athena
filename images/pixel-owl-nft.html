<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixel Owl Knight NFT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace; 
            background: #0a0a0a; 
            color: #e0e0e0; 
            padding: 40px; 
        }
        .title { text-align: center; font-size: 20px; margin-bottom: 30px; letter-spacing: 4px; }
        .subtitle { text-align: center; font-size: 12px; color: #888; margin-bottom: 40px; }
        .compare { display: flex; justify-content: center; gap: 60px; flex-wrap: wrap; }
        .card { text-align: center; }
        .card-label { font-size: 11px; color: #888; margin-bottom: 12px; letter-spacing: 2px; }
        .card svg { border: 1px solid #333; image-rendering: pixelated; }
        .section-title {
            text-align: center; font-size: 14px; color: #888; 
            margin: 50px 0 20px; letter-spacing: 2px;
            border-top: 1px solid #333; padding-top: 30px;
        }
        .sizes { display: flex; justify-content: center; gap: 30px; margin-top: 30px; }
        .sizes .card svg { border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="title">PIXEL OWL KNIGHT</div>
    <div class="subtitle">32x32 Grid | Voxel Style | No Anti-aliasing</div>

    <!-- Main display -->
