  <text x="600" y="235" fill="#888888" font-size="9">mintCertificate(to, uid, tier)</text>
  
  <!-- Verification -->
  <rect x="50" y="290" width="700" height="40" fill="none" stroke="#666666" stroke-width="1"/>
  <text x="400" y="315" text-anchor="middle" fill="#ffffff" font-size="12">30/30 TESTS PASSED | ON-CHAIN VERIFIED | V8</text>
