<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="monospace">
  <rect width="800" height="350" fill="#000000"/>
  
  <text x="400" y="30" text-anchor="middle" fill="#ffffff" font-size="18">SEPOLIA ON-CHAIN VERIFICATION</text>
  <line x1="200" y1="40" x2="600" y2="40" stroke="#333333" stroke-width="1"/>
  
  <!-- AuditCertificate (ERC-1155) -->
  <rect x="50" y="60" width="700" height="60" fill="none" stroke="#666666" stroke-width="1"/>
  <text x="70" y="85" fill="#ffffff" font-size="12">AUDIT CERTIFICATE (ERC-1155)</text>
  <text x="70" y="105" fill="#666666" font-size="10">0x3247d57d37bd1878479f03a077aba807649dbaf5</text>
  <text x="600" y="85" fill="#888888" font-size="9">S/A/B/C 262,144 combinations</text>
  
  <!-- EAS Attestation -->
  <rect x="50" y="135" width="700" height="60" fill="none" stroke="#666666" stroke-width="1"/>
  <text x="70" y="160" fill="#ffffff" font-size="12">EAS ATTESTATION</text>
  <text x="70" y="180" fill="#666666" font-size="10">UID: 0xd02800c960f18f0483af4aa320aff314e34c5a83d1c9a9c963b299a88af958b9</text>
  <text x="600" y="160" fill="#888888" font-size="9">Schema: 0x6d6520d9...8253e</text>
  
  <!-- NFT Minted -->
  <rect x="50" y="210" width="700" height="60" fill="none" stroke="#666666" stroke-width="1"/>
  <text x="70" y="235" fill="#ffffff" font-size="12">GOLD NFT MINTED (Token ID 1)</text>
