<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="monospace">
  <!-- Background -->
  <rect width="800" height="400" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#00ff88" font-size="20" font-weight="bold">Sepolia 链上部署验证</text>
  
  <!-- Contract 1 -->
  <rect x="50" y="60" width="700" height="80" rx="5" fill="#1a1a1a" stroke="#333"/>
  <text x="70" y="85" fill="#4a9eff" font-size="14" font-weight="bold">AuditCertificate (ERC-1155)</text>
  <text x="70" y="105" fill="#fff" font-size="11">0xcaA7faeA44C3513F629C6f260ad26EBB677E5E4E</text>
  <text x="70" y="125" fill="#888" font-size="10">Generative NFT | 12,000 组合 | 3 等级 (A/B/C) | 链上 SVG</text>
  
  <!-- Contract 2 -->
  <rect x="50" y="155" width="700" height="80" rx="5" fill="#1a1a1a" stroke="#333"/>
  <text x="70" y="180" fill="#4a9eff" font-size="14" font-weight="bold">AuditEvidenceChain</text>
  <text x="70" y="200" fill="#fff" font-size="11">0x5e99f144D3e512f525d24077D4626a064899E177</text>
  <text x="70" y="220" fill="#888" font-size="10">审计证据链 | 不可篡改 | 链上存证</text>
  
  <!-- EAS Attestation -->
  <rect x="50" y="250" width="700" height="80" rx="5" fill="#1a1a1a" stroke="#333"/>
  <text x="70" y="275" fill="#9b59b6" font-size="14" font-weight="bold">EAS Attestation</text>
  <text x="70" y="295" fill="#fff" font-size="11">UID: 0x1234567890abcdef...1234567890abcdef</text>
  <text x="70" y="315" fill="#888" font-size="10">https://sepolia.eas.xyz/attestation/0x1234...cdef</text>
  
  <!-- Verification -->
  <rect x="50" y="345" width="700" height="45" rx="5" fill="#00ff8820" stroke="#00ff8840"/>
  <text x="400" y="373" text-anchor="middle" fill="#00ff88" font-size="14" font-weight="bold">✅ 23/23 测试通过 | 链上验证成功 | v5.4</text>
</svg>
