<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="monospace">
  <!-- Background -->
  <rect width="1000" height="600" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#00ff88" font-size="24" font-weight="bold">Athena 8 步审计闭环架构</text>
  
  <!-- GLM-5.1 Core -->
  <rect x="350" y="260" width="300" height="80" rx="10" fill="#1a1a1a" stroke="#00ff88" stroke-width="2"/>
  <text x="500" y="295" text-anchor="middle" fill="#00ff88" font-size="18" font-weight="bold">GLM-5.1 长程推理引擎</text>
  <text x="500" y="320" text-anchor="middle" fill="#888" font-size="12">单次会话完成 8 步跨链推理</text>
  
  <!-- Step 1: Contract Analysis -->
  <rect x="50" y="80" width="120" height="60" rx="5" fill="#1a1a1a" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="110" y="105" text-anchor="middle" fill="#4a9eff" font-size="11">1. 合约分析</text>
  <text x="110" y="125" text-anchor="middle" fill="#888" font-size="9">多合约依赖</text>
  
  <!-- Step 2: Vulnerability Detection -->
  <rect x="200" y="80" width="120" height="60" rx="5" fill="#1a1a1a" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="260" y="105" text-anchor="middle" fill="#4a9eff" font-size="11">2. 漏洞检测</text>
  <text x="260" y="125" text-anchor="middle" fill="#888" font-size="9">12-agent Skill</text>
  
  <!-- Step 3: Symbolic Verification -->
  <rect x="350" y="80" width="120" height="60" rx="5" fill="#1a1a1a" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="410" y="105" text-anchor="middle" fill="#4a9eff" font-size="11">3. 符号验证</text>
  <text x="410" y="125" text-anchor="middle" fill="#888" font-size="9">Halmos 形式化</text>
  
  <!-- Step 4: Attack Simulation -->
  <rect x="500" y="80" width="120" height="60" rx="5" fill="#1a1a1a" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="560" y="105" text-anchor="middle" fill="#4a9eff" font-size="11">4. 攻击模拟</text>
  <text x="560" y="125" text-anchor="middle" fill="#888" font-size="9">PoC 执行验证</text>
  
  <!-- Step 5: Report Generation -->
  <rect x="650" y="80" width="120" height="60" rx="5" fill="#1a1a1a" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="710" y="105" text-anchor="middle" fill="#4a9eff" font-size="11">5. 报告生成</text>
  <text x="710" y="125" text-anchor="middle" fill="#888" font-size="9">Markdown 格式</text>
  
  <!-- Step 6: On-chain Certification -->
  <rect x="800" y="80" width="120" height="60" rx="5" fill="#1a1a1a" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="860" y="105" text-anchor="middle" fill="#ff6b6b" font-size="11">6. 链上认证</text>
  <text x="860" y="125" text-anchor="middle" fill="#888" font-size="9">EAS Attestation</text>
  
  <!-- Step 7: NFT Minting -->
  <rect x="725" y="440" width="120" height="60" rx="5" fill="#1a1a1a" stroke="#ffd700" stroke-width="1.5"/>
  <text x="785" y="465" text-anchor="middle" fill="#ffd700" font-size="11">7. NFT 铸造</text>
  <text x="785" y="485" text-anchor="middle" fill="#888" font-size="9">ERC-1155 分级</text>
  
  <!-- Step 8: Frontend Display -->
  <rect x="875" y="440" width="120" height="60" rx="5" fill="#1a1a1a" stroke="#ff69b4" stroke-width="1.5"/>
  <text x="935" y="465" text-anchor="middle" fill="#ff69b4" font-size="11">8. 前端展示</text>
  <text x="935" y="485" text-anchor="middle" fill="#888" font-size="9">Web Dashboard</text>
  
  <!-- MCP Tools Layer -->
  <rect x="50" y="440" width="250" height="80" rx="10" fill="#1a1a1a" stroke="#9b59b6" stroke-width="2"/>
  <text x="175" y="470" text-anchor="middle" fill="#9b59b6" font-size="14" font-weight="bold">MCP 工具链 (13 工具)</text>
  <text x="175" y="495" text-anchor="middle" fill="#888" font-size="10">scanner | auditor | evidence | repair</text>
  
  <!-- Skill Layer -->
  <rect x="350" y="440" width="250" height="80" rx="10" fill="#1a1a1a" stroke="#e67e22" stroke-width="2"/>
  <text x="475" y="470" text-anchor="middle" fill="#e67e22" font-size="14" font-weight="bold">审计 Skill (12 Agents)</text>
  <text x="475" y="495" text-anchor="middle" fill="#888" font-size="10">reentrancy | overflow | access | logic</text>
  
  <!-- Arrows from GLM to steps -->
  <path d="M 410 260 L 110 140" stroke="#00ff88" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 450 260 L 260 140" stroke="#00ff88" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 500 260 L 410 140" stroke="#00ff88" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 550 260 L 560 140" stroke="#00ff88" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 590 260 L 710 140" stroke="#00ff88" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600 280 L 860 140" stroke="#00ff88" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrows from GLM to bottom -->
  <path d="M 500 340 L 785 440" stroke="#00ff88" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 500 340 L 935 440" stroke="#00ff88" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrows to MCP/Skill -->
  <path d="M 400 340 L 175 440" stroke="#9b59b6" stroke-width="1" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <path d="M 500 340 L 475 440" stroke="#e67e22" stroke-width="1" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  
  <!-- Sequential arrows between steps -->
  <path d="M 170 110 L 200 110" stroke="#4a9eff" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 320 110 L 350 110" stroke="#4a9eff" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 470 110 L 500 110" stroke="#4a9eff" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 620 110 L 650 110" stroke="#4a9eff" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 770 110 L 800 110" stroke="#4a9eff" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from step 6 to 7 -->
  <path d="M 860 140 L 860 200 Q 860 220 840 240 L 785 440" stroke="#ff6b6b" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from step 7 to 8 -->
  <path d="M 845 470 L 875 470" stroke="#ffd700" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff88"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="560" width="900" height="30" rx="5" fill="#1a1a1a"/>
  <circle cx="150" cy="575" r="5" fill="#4a9eff"/>
  <text x="165" y="580" fill="#888" font-size="10">审计流程</text>
  <circle cx="300" cy="575" r="5" fill="#9b59b6"/>
  <text x="315" y="580" fill="#888" font-size="10">MCP 工具</text>
  <circle cx="450" cy="575" r="5" fill="#e67e22"/>
  <text x="465" y="580" fill="#888" font-size="10">审计 Skill</text>
  <circle cx="600" cy="575" r="5" fill="#ff6b6b"/>
  <text x="615" y="580" fill="#888" font-size="10">链上操作</text>
  <circle cx="750" cy="575" r="5" fill="#ffd700"/>
  <text x="765" y="580" fill="#888" font-size="10">NFT 铸造</text>
</svg>
