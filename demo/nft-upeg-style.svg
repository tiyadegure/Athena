<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Dark blue background (uPEG style) -->
  <rect width="400" height="400" fill="#0a1a2e"/>
  
  <!-- Pixel art owl (Athena's symbol) in uPEG style -->
  <!-- Body -->
  <rect x="150" y="120" width="100" height="120" fill="#2a5a8a"/>
  <rect x="160" y="130" width="80" height="100" fill="#3a6a9a"/>
  
  <!-- Head -->
  <rect x="160" y="80" width="80" height="60" fill="#3a6a9a"/>
  <rect x="170" y="70" width="60" height="20" fill="#2a5a8a"/>
  
  <!-- Helmet crest (simplified) -->
  <rect x="185" y="40" width="30" height="40" fill="#2a5a8a"/>
  <rect x="190" y="30" width="20" height="15" fill="#3a6a9a"/>
  <rect x="195" y="20" width="10" height="15" fill="#FFD700"/>
  
  <!-- Eyes (owl-like, glowing) -->
  <circle cx="185" cy="105" r="15" fill="#FFD700"/>
  <circle cx="215" cy="105" r="15" fill="#FFD700"/>
  <circle cx="185" cy="105" r="8" fill="#0a1a2e"/>
  <circle cx="215" cy="105" r="8" fill="#0a1a2e"/>
  <circle cx="185" cy="105" r="4" fill="#FFD700"/>
  <circle cx="215" cy="105" r="4" fill="#FFD700"/>
  
  <!-- Beak -->
  <rect x="195" y="120" width="10" height="8" fill="#FFD700"/>
  
  <!-- Wings (spread) -->
  <rect x="110" y="130" width="40" height="80" fill="#2a5a8a"/>
  <rect x="100" y="140" width="20" height="60" fill="#3a6a9a"/>
  <rect x="250" y="130" width="40" height="80" fill="#2a5a8a"/>
  <rect x="280" y="140" width="20" height="60" fill="#3a6a9a"/>
  
  <!-- Talons -->
  <rect x="170" y="240" width="15" height="25" fill="#FFD700"/>
  <rect x="215" y="240" width="15" height="25" fill="#FFD700"/>
  <rect x="165" y="260" width="10" height="8" fill="#FFD700"/>
  <rect x="180" y="260" width="10" height="8" fill="#FFD700"/>
  <rect x="210" y="260" width="10" height="8" fill="#FFD700"/>
  <rect x="225" y="260" width="10" height="8" fill="#FFD700"/>
  
  <!-- Shield emblem on chest -->
  <circle cx="200" cy="180" r="20" fill="#1a3a6a"/>
  <circle cx="200" cy="180" r="15" fill="#2a5a8a"/>
  <!-- Owl face in shield -->
  <circle cx="193" cy="176" r="5" fill="#FFD700"/>
  <circle cx="207" cy="176" r="5" fill="#FFD700"/>
  <rect x="197" y="183" width="6" height="4" fill="#FFD700"/>
  
  <!-- Subtle glow around eyes -->
  <circle cx="185" cy="105" r="25" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
  <circle cx="215" cy="105" r="25" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
</svg>
