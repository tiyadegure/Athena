<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- S-tier rainbow gradient -->
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0000"/>
      <stop offset="16%" style="stop-color:#ff8800"/>
      <stop offset="33%" style="stop-color:#ffff00"/>
      <stop offset="50%" style="stop-color:#00ff00"/>
      <stop offset="66%" style="stop-color:#0088ff"/>
      <stop offset="83%" style="stop-color:#8800ff"/>
      <stop offset="100%" style="stop-color:#ff0088"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with subtle texture -->
  <rect width="400" height="400" fill="#0a0a1a"/>
  <!-- Stars -->
  <circle cx="50" cy="40" r="1" fill="#4a9eff" opacity="0.6"/>
  <circle cx="350" cy="60" r="1.5" fill="#4a9eff" opacity="0.5"/>
  <circle cx="80" cy="320" r="1" fill="#4a9eff" opacity="0.4"/>
  <circle cx="320" cy="340" r="1.5" fill="#4a9eff" opacity="0.6"/>
  <circle cx="180" cy="30" r="1" fill="#4a9eff" opacity="0.5"/>
  <circle cx="280" cy="370" r="1" fill="#4a9eff" opacity="0.4"/>
  
  <!-- Golden border frame -->
  <rect x="20" y="20" width="360" height="360" rx="5" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.3"/>
  <!-- Greek meander pattern (simplified) -->
  <rect x="30" y="30" width="340" height="340" rx="3" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.15" stroke-dasharray="8,4,2,4"/>
  
  <!-- Body (more detailed) -->
  <rect x="155" y="180" width="90" height="110" rx="8" fill="#1a3a6a"/>
  <!-- Armor plate -->
  <rect x="160" y="185" width="80" height="40" rx="4" fill="#2a5a8a"/>
  <!-- Armor detail line -->
  <rect x="165" y="225" width="70" height="3" fill="#FFD700" opacity="0.4"/>
  
  <!-- Head/Face -->
  <rect x="170" y="110" width="60" height="70" rx="8" fill="#ffd4a8"/>
  
  <!-- Eyes (more detailed) -->
  <rect x="182" y="135" width="14" height="10" rx="3" fill="#ffffff"/>
  <rect x="185" y="137" width="8" height="6" rx="2" fill="#3498DB"/>
  <rect x="187" y="139" width="4" height="4" rx="1" fill="#1a1a2e"/>
  <rect x="204" y="135" width="14" height="10" rx="3" fill="#ffffff"/>
  <rect x="207" y="137" width="8" height="6" rx="2" fill="#3498DB"/>
  <rect x="209" y="139" width="4" height="4" rx="1" fill="#1a1a2e"/>
  
  <!-- Eyebrows -->
  <rect x="182" y="130" width="14" height="3" rx="1" fill="#d4a56a"/>
  <rect x="204" y="130" width="14" height="3" rx="1" fill="#d4a56a"/>
  
  <!-- Nose -->
  <rect x="196" y="150" width="8" height="4" rx="1" fill="#e8b89a"/>
  
  <!-- Mouth -->
  <rect x="190" y="162" width="20" height="3" rx="1" fill="#c4856a"/>
  
  <!-- Blush -->
  <ellipse cx="180" cy="155" rx="8" ry="5" fill="#ffb6c1" opacity="0.3"/>
  <ellipse cx="220" cy="155" rx="8" ry="5" fill="#ffb6c1" opacity="0.3"/>
  
  <!-- Hair (golden) -->
  <rect x="165" y="95" width="70" height="30" rx="6" fill="#FFD700"/>
  <rect x="160" y="105" width="15" height="50" rx="4" fill="#FFD700"/>
  <rect x="225" y="105" width="15" height="50" rx="4" fill="#FFD700"/>
  <!-- Hair strands -->
  <rect x="155" y="120" width="10" height="40" rx="3" fill="#FFA500"/>
  <rect x="235" y="120" width="10" height="40" rx="3" fill="#FFA500"/>
  
  <!-- Helmet (detailed Corinthian style) -->
  <rect x="155" y="75" width="90" height="50" rx="8" fill="#2a5a8a"/>
  <rect x="160" y="70" width="80" height="30" rx="6" fill="#3a6a9a"/>
  
  <!-- Helmet crest/plume -->
  <rect x="185" y="30" width="30" height="50" rx="5" fill="#2a5a8a"/>
  <rect x="190" y="20" width="20" height="20" rx="4" fill="#3a6a9a"/>
  <!-- Plume feathers -->
  <rect x="185" y="25" width="30" height="8" rx="3" fill="#FFD700"/>
  <rect x="190" y="15" width="20" height="12" rx="3" fill="#FFD700" opacity="0.8"/>
  <rect x="195" y="8" width="10" height="10" rx="2" fill="#FFD700" opacity="0.6"/>
  
  <!-- Helmet cheek guards -->
  <rect x="155" y="95" width="20" height="35" rx="4" fill="#2a5a8a"/>
  <rect x="225" y="95" width="20" height="35" rx="4" fill="#2a5a8a"/>
  
  <!-- Greek meander on helmet brim -->
  <rect x="162" y="95" width="76" height="4" rx="1" fill="#FFD700" opacity="0.6"/>
  
  <!-- Legs -->
  <rect x="170" y="290" width="25" height="50" rx="4" fill="#1a3a6a"/>
  <rect x="205" y="290" width="25" height="50" rx="4" fill="#1a3a6a"/>
  <!-- Boots -->
  <rect x="168" y="335" width="30" height="12" rx="3" fill="#FFD700"/>
  <rect x="203" y="335" width="30" height="12" rx="3" fill="#FFD700"/>
  
  <!-- Shield (with owl) -->
  <rect x="100" y="170" width="55" height="70" rx="10" fill="#2a5a8a"/>
  <rect x="105" y="175" width="45" height="60" rx="7" fill="#1a3a6a"/>
  <!-- Owl emblem -->
  <circle cx="127" cy="205" r="12" fill="#3a6a9a"/>
  <circle cx="127" cy="205" r="8" fill="#2a5a8a"/>
  <!-- Owl eyes -->
  <circle cx="122" cy="202" r="3" fill="#FFD700"/>
  <circle cx="132" cy="202" r="3" fill="#FFD700"/>
  <circle cx="122" cy="202" r="1.5" fill="#1a1a2e"/>
  <circle cx="132" cy="202" r="1.5" fill="#1a1a2e"/>
  <!-- Owl beak -->
  <rect x="125" y="207" width="4" height="3" fill="#FFD700"/>
  <!-- Greek key border on shield -->
  <rect x="107" y="177" width="41" height="2" fill="#FFD700" opacity="0.4"/>
  <rect x="107" y="233" width="41" height="2" fill="#FFD700" opacity="0.4"/>
  
  <!-- Spear -->
  <rect x="250" y="80" width="6" height="250" fill="#3a6a9a"/>
  <rect x="245" y="65" width="16" height="20" rx="3" fill="#FFD700"/>
  <rect x="249" y="50" width="8" height="18" rx="2" fill="#FFD700" opacity="0.8"/>
  <rect x="252" y="40" width="2" height="12" fill="#FFD700" opacity="0.6"/>
  
  <!-- Laurel wreath (subtle) -->
  <path d="M170,175 Q165,170 160,175 Q165,180 170,175" fill="#4CAF50" opacity="0.5"/>
  <path d="M230,175 Q235,170 240,175 Q235,180 230,175" fill="#4CAF50" opacity="0.5"/>
  
  <!-- Glow effect for S-tier -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  
  <!-- ATHENA text -->
  <text x="200" y="380" font-family="monospace" font-size="16" font-weight="bold" fill="#FFD700" text-anchor="middle" letter-spacing="4">ATHENA</text>
</svg>
