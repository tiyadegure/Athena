<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Face -->
  <rect x="190" y="180" width="132" height="100" fill="#ffd4a8"/>
  
  <!-- Helmet base -->
  <rect x="170" y="140" width="172" height="60" rx="8" fill="#888888"/>
  
  <!-- Helmet crest (top) -->
  <rect x="230" y="80" width="52" height="70" rx="4" fill="#888888"/>
  <rect x="240" y="60" width="32" height="30" rx="4" fill="#aaaaaa"/>
  
  <!-- Helmet sides -->
  <rect x="170" y="150" width="30" height="50" rx="4" fill="#777777"/>
  <rect x="312" y="150" width="30" height="50" rx="4" fill="#777777"/>
  
  <!-- Eyes -->
  <rect x="218" y="210" width="24" height="16" rx="2" fill="#3498DB"/>
  <rect x="270" y="210" width="24" height="16" rx="2" fill="#3498DB"/>
  <rect x="224" y="214" width="12" height="8" fill="#1a1a2e"/>
  <rect x="276" y="214" width="12" height="8" fill="#1a1a2e"/>
  
  <!-- Nose -->
  <rect x="248" y="240" width="16" height="8" rx="2" fill="#e8c4a0"/>
  
  <!-- Mouth -->
  <rect x="236" y="260" width="40" height="6" rx="2" fill="#c4956a"/>
  
  <!-- Body armor -->
  <rect x="180" y="280" width="152" height="120" rx="8" fill="#666666"/>
  <rect x="190" y="290" width="132" height="40" rx="4" fill="#888888"/>
  
  <!-- Armor details -->
  <rect x="240" y="340" width="32" height="50" rx="4" fill="#555555"/>
  
  <!-- Shield (left) -->
  <rect x="110" y="290" width="70" height="90" rx="10" fill="#777777"/>
  <rect x="120" y="300" width="50" height="70" rx="6" fill="#666666"/>
  <circle cx="145" cy="335" r="15" fill="#888888"/>
  <circle cx="145" cy="335" r="8" fill="#999999"/>
  
  <!-- Spear (right) -->
  <rect x="350" y="180" width="8" height="280" fill="#888888"/>
  <rect x="344" y="160" width="20" height="24" rx="2" fill="#aaaaaa"/>
  <rect x="348" y="148" width="12" height="16" rx="2" fill="#cccccc"/>
  
  <!-- Owl emblem on shield -->
  <rect x="135" y="325" width="20" height="16" rx="2" fill="#aaaaaa"/>
  <rect x="138" y="328" width="6" height="6" fill="#1a1a2e"/>
  <rect x="148" y="328" width="6" height="6" fill="#1a1a2e"/>
  
  <!-- "ATHENA" text at bottom -->
  <text x="256" y="460" font-family="monospace" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="8">ATHENA</text>
</svg>
